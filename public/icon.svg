<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background — warm ink -->
  <rect width="512" height="512" rx="112" fill="#1a1815"/>
  
  <!-- Decorative border — subtle inner ring -->
  <rect x="32" y="32" width="448" height="448" rx="80" fill="none" stroke="#4a9a9a" stroke-width="1.5" opacity="0.25"/>
  
  <!-- Five prayer-time bands — representing the five daily prayers -->
  <g opacity="0.85">
    <rect x="80" y="100" width="352" height="6" rx="3" fill="#4a9a9a"/>
    <rect x="80" y="140" width="264" height="6" rx="3" fill="#c97a4a"/>
    <rect x="80" y="180" width="308" height="6" rx="3" fill="#4a9a9a"/>
    <rect x="80" y="220" width="220" height="6" rx="3" fill="#c97a4a"/>
    <rect x="80" y="260" width="352" height="6" rx="3" fill="#4a9a9a"/>
  </g>
  
  <!-- Arabic "وقت" (Waqt = Time) — centerpiece -->
  <text 
    x="256" y="410" 
    font-family="Amiri, Noto Naskh Arabic, serif" 
    font-size="200" 
    font-weight="700" 
    fill="#f5f0e8" 
    text-anchor="middle" 
    dominant-baseline="middle"
    filter="url(#shadow)"
    direction="rtl"
  >وقت</text>
</svg>
