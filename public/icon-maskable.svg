<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Maskable variant: full-bleed background, no rounded corners —
       the OS applies its own mask. Artwork sits inside the ~80% safe zone. -->
  <rect width="512" height="512" fill="#1a1815"/>

  <g transform="translate(64,64) scale(0.75)">
    <!-- Five prayer-time bands -->
    <g opacity="0.85">
      <rect x="80" y="100" width="352" height="7" rx="3.5" fill="#4a9a9a"/>
      <rect x="80" y="140" width="264" height="7" rx="3.5" fill="#c97a4a"/>
      <rect x="80" y="180" width="308" height="7" rx="3.5" fill="#4a9a9a"/>
      <rect x="80" y="220" width="220" height="7" rx="3.5" fill="#c97a4a"/>
      <rect x="80" y="260" width="352" height="7" rx="3.5" fill="#4a9a9a"/>
    </g>

    <!-- Arabic "وقت" — centerpiece -->
    <text
      x="256" y="400"
      font-family="Amiri, Noto Naskh Arabic, serif"
      font-size="190"
      font-weight="700"
      fill="#f5f0e8"
      text-anchor="middle"
      dominant-baseline="middle"
      direction="rtl"
    >وقت</text>
  </g>
</svg>
