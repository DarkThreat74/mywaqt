<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sirat</title>
<meta name="theme-color" content="#EFEEE9" id="tc">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Sirat">
<meta name="description" content="Halal-certified food, places and masjids within 40 miles of Glen Ellyn.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --brand:#146B70;--on-brand:#F7F3EC;--tonal:#D9ECE8;--on-tonal:#123E40;
  --bg:#F5F0E8;--surface:#FBF8F2;--surface2:#EBE4D9;--text:#332F2A;--sub:#6F675E;--line:#D8D0C4;--outline:#9B9287;
  --err:#B44A3A;--land:#E8E0D4;--urban:#DED6CA;--water:#B7D2EA;--grid:rgba(51,47,42,.07);--ring:rgba(51,47,42,.35);--lbl:#403B35;--halo:#FBF8F2;
  --hwy:#F2C265;--hwyc:#C99532;--rd:#FFFFFF;--rdc:#C9C5BA;--scrim:rgba(0,0,0,.32);
  --sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);
  --nav:64px;--top:116px;
  --sh1:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15);--sh2:0 1px 2px rgba(0,0,0,.3),0 2px 6px 2px rgba(0,0,0,.15);
  --font:system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--brand:#77B6B5;--on-brand:#173739;--tonal:#214E50;--on-tonal:#D9ECE8;--bg:#211F1B;--surface:#2A2722;--surface2:#37322B;--text:#EEE7DC;--sub:#AAA094;--line:#4A433A;--outline:#8D8275;--err:#F2B8B5;--land:#1B1E1D;--urban:#222625;--water:#233646;--grid:rgba(255,255,255,.05);--ring:rgba(255,255,255,.4);--lbl:#D5D8D4;--halo:#141615;--hwy:#8C6D2E;--hwyc:#5C4720;--rd:#3A3E3C;--rdc:#2A2D2C;--scrim:rgba(0,0,0,.55)}}
:root[data-theme=dark]{--brand:#77B6B5;--on-brand:#173739;--tonal:#214E50;--on-tonal:#D9ECE8;--bg:#211F1B;--surface:#2A2722;--surface2:#37322B;--text:#EEE7DC;--sub:#AAA094;--line:#4A433A;--outline:#8D8275;--err:#F2B8B5;--land:#1B1E1D;--urban:#222625;--water:#233646;--grid:rgba(255,255,255,.05);--ring:rgba(255,255,255,.4);--lbl:#D5D8D4;--halo:#141615;--hwy:#8C6D2E;--hwyc:#5C4720;--rd:#3A3E3C;--rdc:#2A2D2C;--scrim:rgba(0,0,0,.55)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--land);color:var(--text);overscroll-behavior:none}
body{font:400 16px/1.4 var(--font);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#map{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#top{position:fixed;left:0;right:0;top:calc(var(--sat) + 10px);z-index:6;pointer-events:none;padding:0 12px}
#search{pointer-events:auto;height:52px;border-radius:26px;background:var(--surface);box-shadow:var(--sh2);display:flex;align-items:center;padding:0 4px}
#search .ib{width:48px;height:48px;display:grid;place-items:center;border-radius:24px;color:var(--sub)}
#top{padding:10px 16px 0;max-width:680px}
.appbar{height:48px;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:auto;margin-bottom:8px}
.homeback{display:inline-flex;align-items:center;gap:7px;color:var(--text);font:600 13px var(--font);letter-spacing:.01em}
.homeback span:first-child{display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--surface) 82%,transparent);font-size:18px;line-height:1}
.brandmark{display:flex;align-items:center;gap:8px;position:absolute;left:50%;transform:translateX(-50%);pointer-events:none}
.brandmark b{display:block;font:700 15px var(--font);letter-spacing:.08em;text-transform:uppercase}
.brandmark small{display:block;margin-top:-2px;color:var(--sub);font:500 9px var(--font);letter-spacing:.16em;text-transform:uppercase}
.branddot{width:8px;height:8px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 5px color-mix(in srgb,var(--brand) 15%,transparent)}
.info-button{border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 82%,transparent)}
.searchmark{display:grid;place-items:center;width:40px;color:var(--brand);font-size:25px;line-height:1}
#search{border:1px solid var(--line);border-radius:16px;background:color-mix(in srgb,var(--surface) 94%,transparent);box-shadow:var(--sh2);padding:0 6px}
#q{font-size:15px}

#q{flex:1;min-width:0;height:48px;border:0;background:transparent;color:var(--text);font:400 17px var(--font);outline:0;user-select:text;-webkit-user-select:text}
#q::placeholder{color:var(--sub)}
.chips{pointer-events:auto;display:flex;gap:8px;overflow-x:auto;padding:10px 12px 2px;margin:0 -12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
#chips{padding-bottom:6px}
.chip{flex:none;height:36px;padding:0 14px;border-radius:10px;background:var(--surface);color:var(--text);box-shadow:var(--sh1);display:inline-flex;align-items:center;gap:6px;font:500 14px var(--font);white-space:nowrap}
.chip svg.i{width:18px;height:18px}
.chip.on{background:var(--tonal);color:var(--on-tonal)}
.chip b{font-weight:500;min-width:18px;height:18px;border-radius:9px;background:var(--brand);color:var(--on-brand);display:inline-grid;place-items:center;font-size:12px;padding:0 5px}
#chips2 .chip{height:34px;padding:0 12px 0 10px}
#sheet{position:fixed;left:0;right:0;bottom:calc(var(--nav) + var(--sab));height:calc(100dvh - var(--nav) - var(--sab) - var(--top) - var(--sat));background:var(--surface);border-radius:28px 28px 0 0;box-shadow:0 -1px 3px rgba(0,0,0,.2),0 -3px 10px rgba(0,0,0,.12);display:flex;flex-direction:column;transform:translateY(calc(100% - var(--vis,100px)));transition:transform .3s cubic-bezier(.2,.8,.2,1);will-change:transform;z-index:5}
#sheet.drag{transition:none}
#sheet[data-snap=full] #locate{opacity:0;pointer-events:none}
#locate{transition:opacity .2s}
#locate{position:absolute;right:14px;top:-62px;width:48px;height:48px;border-radius:24px;background:var(--surface);box-shadow:var(--sh2);display:grid;place-items:center;color:var(--text)}
#head{flex:none;touch-action:none}
#grab{display:block;width:100%;height:22px;position:relative}
#grab:after{content:"";position:absolute;left:50%;top:9px;width:32px;height:4px;margin-left:-16px;border-radius:2px;background:var(--outline);opacity:.7}
#hrow{display:flex;align-items:center;gap:4px;padding:0 8px 8px 20px;min-height:58px}
#hrow .t{flex:1;min-width:0}
#hrow .t b{display:block;font:500 18px/1.25 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hrow .t span{display:block;font:400 14px/1.3 var(--font);color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sort{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 10px;margin-right:4px;border-radius:17px;border:1px solid var(--line);font:500 13px var(--font);color:var(--text);white-space:nowrap}
#sort svg.i{width:16px;height:16px}
.ib{width:48px;height:48px;display:grid;place-items:center;border-radius:24px;flex:none}
.ib:active{background:var(--surface2)}
#body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;border-top:1px solid var(--line);user-select:text;-webkit-user-select:text}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:12px 20px 12px 16px;min-height:72px;position:relative}
.row:active{background:var(--surface2)}
.row+.row:before{content:"";position:absolute;left:70px;right:0;top:0;height:1px;background:var(--line)}
.lead{flex:none;width:42px;height:42px;border-radius:21px;background:var(--tonal);color:var(--on-tonal);display:grid;place-items:center}
.lead svg.i{width:22px;height:22px}
.row .m{flex:1;min-width:0}
.row .n{font:500 16px/1.3 var(--font);overflow-wrap:anywhere}
.row .s{font:400 14px/1.35 var(--font);color:var(--sub);margin-top:2px}
.row .d{font:500 14px var(--font);color:var(--text);white-space:nowrap;text-align:right}
.row .d small{display:block;font:400 12.5px var(--font);color:var(--sub);margin-top:2px}
.ok{color:var(--brand);font-weight:500}.no{color:var(--err)}
.more{display:block;width:100%;padding:16px;text-align:center;font:500 14px var(--font);color:var(--brand)}
.empty{padding:36px 24px;text-align:center}
.empty h3{font:500 20px var(--font);margin-bottom:6px}
.empty p{color:var(--sub);margin:0 auto 18px;max-width:30ch}
.btn{height:44px;padding:0 20px;border-radius:22px;font:500 15px var(--font);display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--outline);color:var(--brand);white-space:nowrap;text-decoration:none}
.btn.f{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.t{background:var(--tonal);border-color:var(--tonal);color:var(--on-tonal)}
.btn.txt{border-color:transparent;padding:0 12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg.i{width:20px;height:20px}
.rec{padding:4px 0 28px}
.acts{display:flex;gap:8px;padding:6px 16px 14px;overflow-x:auto;scrollbar-width:none}
.acts::-webkit-scrollbar{display:none}
.acts .btn{padding:0 14px}
.kv .it{display:flex;gap:18px;padding:13px 20px;align-items:flex-start}
.kv .it svg.i{color:var(--brand);margin-top:1px}
.kv .it div{flex:1;min-width:0;font-size:16px;overflow-wrap:anywhere}
.kv .it small{display:block;font-size:14px;color:var(--sub);margin-top:2px}
.kv .sep{height:1px;background:var(--line);margin:0 0 0 62px}
.wk{border-collapse:collapse;margin-top:4px}
.wk td{padding:2px 18px 2px 0;font-size:14px;color:var(--sub)}
.wk tr.today td{color:var(--text);font-weight:500}
.tags{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 8px}
.tag{height:28px;padding:0 10px;border-radius:8px;background:var(--surface2);display:inline-flex;align-items:center;font:500 13px var(--font)}
.tag.b{background:var(--tonal);color:var(--on-tonal)}
.tag.w{background:color-mix(in srgb,#E8A317 24%,var(--surface));color:var(--text)}
textarea{width:100%;min-height:76px;border:1px solid var(--outline);border-radius:12px;background:transparent;color:var(--text);padding:12px;font:400 16px/1.4 var(--font);resize:vertical;user-select:text;-webkit-user-select:text}
select{width:100%;height:48px;border:1px solid var(--outline);border-radius:12px;background:var(--surface);color:var(--text);padding:0 12px;font:400 16px var(--font)}
#scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:8}
#scrim.on{opacity:1;pointer-events:auto}
#scrim.lite{background:transparent}
.panel{position:fixed;left:0;right:0;bottom:0;height:80dvh;background:var(--surface);border-radius:28px 28px 0 0;z-index:9;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);visibility:hidden;box-shadow:0 -2px 12px rgba(0,0,0,.2)}
#pFilter{height:66dvh}
.panel.on{transform:none;visibility:visible}
.panel .gr{height:22px;position:relative;flex:none}
.panel .gr:after{content:"";position:absolute;left:50%;top:9px;width:32px;height:4px;margin-left:-16px;border-radius:2px;background:var(--outline);opacity:.7}
.panel header{flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 24px;height:52px}
.panel h2{font:500 22px var(--font)}
.panel .pb{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 24px 20px;user-select:text;-webkit-user-select:text}
.panel footer{flex:none;display:flex;gap:8px;justify-content:flex-end;padding:12px 20px calc(12px + var(--sab));border-top:1px solid var(--line)}
.panel footer .f{flex:1}
.grp{padding:8px 0 4px}
.grp h3{font:500 14px var(--font);color:var(--sub);margin:12px 0 10px;display:flex;justify-content:space-between}
.grp h3 em{font-style:normal;color:var(--brand)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--outline);font:500 14px var(--font);display:inline-flex;align-items:center;gap:6px}
.opt small{font:400 12px var(--font);color:var(--sub)}
.opt[aria-pressed=true]{background:var(--tonal);border-color:var(--tonal);color:var(--on-tonal)}
.opt[aria-pressed=true] small{color:inherit}
.opt[aria-pressed=true]:before{content:"";width:12px;height:6px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg) translate(1px,-2px);margin-right:2px}
.hint{font:400 13px/1.4 var(--font);color:var(--sub);margin-top:8px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:56px;font:400 16px var(--font)}
.sw i{flex:none;width:52px;height:32px;border-radius:16px;border:2px solid var(--outline);position:relative;transition:background .15s}
.sw i:after{content:"";position:absolute;top:6px;left:6px;width:16px;height:16px;border-radius:8px;background:var(--outline);transition:all .15s}
.sw[aria-pressed=true] i{background:var(--brand);border-color:var(--brand)}
.sw[aria-pressed=true] i:after{top:4px;width:24px;height:24px;border-radius:12px;background:var(--on-brand);left:24px}
.li{padding:14px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.li h3{font:500 16px var(--font);margin-bottom:4px}
.li p{color:var(--sub);font-size:14px}
.bar{height:6px;border-radius:3px;background:var(--surface2);margin:12px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.leg{display:grid;grid-template-columns:22px 1fr;gap:8px 12px;align-items:center;margin-top:10px;font-size:14px}
.dot{width:12px;height:12px;border-radius:50%;margin:auto;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + var(--sab));padding-bottom:var(--sab);background:var(--surface2);display:grid;grid-template-columns:repeat(4,1fr);z-index:7}
#nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--sub);font:500 12px var(--font)}
#nav button .pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .2s}
#nav button[aria-selected=true]{color:var(--text)}
#nav button[aria-selected=true] .pill{background:var(--tonal);color:var(--on-tonal)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--nav) + var(--sab) + var(--vis,100px) + 16px);max-width:420px;margin:0 auto;background:#313331;color:#F1F1EE;border-radius:8px;padding:14px 16px;font:400 14px/1.4 var(--font);z-index:12;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (min-width:900px),(min-width:600px) and (max-height:520px){
  :root{--top:0px}
  #sheet{left:0;right:auto;width:400px;top:0;height:auto;bottom:calc(var(--nav) + var(--sab));border-radius:0;transform:none!important;box-shadow:2px 0 8px rgba(0,0,0,.2)}
  #grab{display:none}
  #nav{right:auto;width:400px}
  #top{left:400px;right:auto;width:min(560px,calc(100% - 424px));padding:12px 20px 0}
  #locate{right:-62px;top:auto;bottom:24px}
  .panel{left:50%;right:auto;width:480px;margin-left:-240px;bottom:auto;top:10dvh;height:auto;max-height:80dvh;border-radius:28px}
  #pFilter{height:auto}
  .panel:not(.on){transform:translateY(40px);opacity:0}
  .panel.on{opacity:1}
  #toast{left:424px;right:auto;bottom:24px;margin:0}
}
@media (prefers-reduced-motion:reduce){#sheet,.panel,#scrim,#toast,.bar i{transition:none}}
</style>
</head>
<body>
<canvas id="map" role="img" aria-label="Map of halal places within 40 miles of Glen Ellyn. Use the list to browse."></canvas>

<div id="top">
  <div class="appbar">
    <button id="bHome" class="homeback" aria-label="Back to Waqt home"><span aria-hidden="true">←</span><span>Waqt</span></button>
    <div class="brandmark"><span class="branddot"></span><div><b>Sirat</b><small>field atlas</small></div></div>
    <button class="ib info-button" id="bInfo" aria-label="About and settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </div>
  <div id="search">
    <span class="searchmark" aria-hidden="true">⌕</span>
    <input id="q" type="search" inputmode="search" enterkeyhint="search" placeholder="Find a place, town, or masjid" aria-label="Search places by name or town" autocomplete="off">
    <button class="ib" id="qx" aria-label="Clear search" hidden><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="chips" id="chips2" hidden></div>
</div>

<section id="sheet" aria-label="Places">
  <button id="locate" aria-label="Show my location"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
  <div id="head">
    <button id="grab" aria-label="Resize list"></button>
    <div id="hrow"></div>
  </div>
  <div id="body"></div>
</section>

<nav id="nav" role="tablist" aria-label="What to look for"></nav>

<div id="scrim"></div>
<section class="panel" id="pFilter" role="dialog" aria-modal="true" aria-label="Filters">
  <div class="gr"></div>
  <header><h2>Filters</h2></header>
  <div class="pb" id="fBody"></div>
  <footer><button class="btn txt" id="fClear">Clear all</button><button class="btn f" id="fDone">Show places</button></footer>
</section>
<section class="panel" id="pInfo" role="dialog" aria-modal="true" aria-label="About and settings">
  <div class="gr"></div>
  <header><h2>Sirat</h2><button class="ib" id="iClose" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <div class="pb" id="iBody"></div>

$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;buzz();layer=b.dataset.k;sel=null;toList();if(layer==='D'||layer==='M')F.when='any';if(layer!=='D')F.ac=[];F.cert='any';F.io='any';F.area=[];F.tr='any';F.price=layer==='M'?[]:F.price;limit=60;render();$('#body').scrollTop=0;setTimeout(()=>{metrics();setSnap(snap)},0)});
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;const k=b.dataset.c;
 if(k==='now'||k==='mag'){F.when=F.when===k?'any':k;limit=60;render(false)}else if(k==='trS'||k==='trH'){const v=k==='trS'?'S':'H';F.tr=F.tr===v?'any':v;limit=60;render(false)}else showPanel('pFilter',k)});
$('#chips2').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;const k=b.dataset.a,i=F.ac.indexOf(k);i<0?F.ac.push(k):F.ac.splice(i,1);limit=60;buzz();toList();render(false);if(snap==='peek'&&!wide())setSnap('half')});

/* panels */
function showPanel(id,focus){openPanel=id;$('#scrim').classList.toggle('lite',id==='pFilter'&&!wide());$('#scrim').classList.add('on');$('#'+id).classList.add('on');filterOpen=id==='pFilter';hpush('p');
 if(filterOpen){buildFilter();if(!wide()){const v=Math.round(innerHeight*.66)-navPx();tweenVis(v,320);const rx=wx(ref.lng),ry=wy(ref.lat);fly(rx,ry,Math.max(4.4,Math.min(W,H-v-TOPH)/2/(F.dist>=40?46:F.dist+8)),420)}if(focus&&focus!=='all'){setTimeout(()=>{const g=document.querySelector(`#fBody [data-g=${focus}]`);g&&g.scrollIntoView({block:'start'})},60)}}
 draw()}
function closePanel(fromPop){if(!openPanel)return;$('#'+openPanel).classList.remove('on');$('#scrim').classList.remove('on');const wasF=filterOpen;openPanel=null;filterOpen=false;
 if(wasF&&!wide())tweenVis(VIS[snap]);if(!fromPop)hpop('p');render(false);draw()}
$('#scrim').addEventListener('click',()=>closePanel());
$('#bHome').addEventListener('click',()=>{window.location.href='/'});
$('#bInfo').addEventListener('click',()=>{buildInfo();showPanel('pInfo')});
$('#iClose').addEventListener('click',()=>closePanel());
$('#fDone').addEventListener('click',()=>closePanel());
$('#fClear').addEventListener('click',()=>{F=Object.assign(F0(),{q:F.q});buildFilter();render(false);draw()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(openPanel)closePanel();else if(view==='detail'){if(HS[HS.length-1]==='d')history.back();else back()}}});
function grp(g,label,key,opts,multi,hint,extra){return `<div class="grp" data-g="${g}"><h3><span>${label}</span>${extra||''}</h3><div class="opts" role="group" aria-label="${label}">${opts.map(([v,t,n])=>{const on=multi?F[key].includes(v):F[key]===v;return `<button class="opt" aria-pressed="${on}" data-key="${key}" data-v="${esc(v)}" data-m="${multi?1:0}">${esc(t)}${n!=null?` <small>${n}</small>`:''}</button>`}).join('')}</div>${hint?`<p class="hint">${hint}</p>`:''}</div>`}
function buildFilter(){
 const inLayer=P.filter(p=>p.k===layer);
 const unpriced=inLayer.filter(p=>p.p==null&&p.mi<=F.dist).length;
 let h='';
 if(layer==='D')h+=grp('act','Activity','ac',Object.entries(ACT).map(([k,t])=>[k,t,inLayer.filter(p=>p.ac===k).length]),true,'');
 if(layer==='M')h+=grp('tr','Tradition','tr',[['any','Any'],['S','Sunni',inLayer.filter(p=>p.tr==='S').length],['H','Shia',inLayer.filter(p=>p.tr==='H').length]],false,'Shia is only used where a listing, the masjid itself or reviews say so. Sunni means no Shia or Ahmadiyya affiliation was found, so check with the masjid if it matters. Ahmadiyya centers show under Any only.');
 const cnt={};for(const p of inLayer)cnt[p.ar]=(cnt[p.ar]||0)+1;
 let areas=Object.entries(cnt).filter(([a])=>a!=='Other').sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
 const chosen=F.area.filter(a=>cnt[a]);let shown=allAreas?areas:areas.slice(0,14);
 for(const a of chosen)if(!shown.find(x=>x[0]===a))shown.push([a,cnt[a]]);
 h+=grp('area','Area','area',shown.map(([a,n])=>[a,a,n]),true,'',areas.length>14?`<em role="button" tabindex="0" id="areaMore" style="cursor:pointer">${allAreas?'Show fewer':'Show all '+areas.length}</em>`:'');
 if(layer==='E'||layer==='S')h+=grp('when','Open','when',[['any','Any time'],['now','Open now'],['mag','After Maghrib'],['late','Late (10 PM)']],false,F.when!=='any'?`Only places with verified hours can match. After Maghrib is ${fmt(MAGH+30)} today.`:'');
 if(layer!=='M')h+=grp('price','Price','price',[[0,'Free'],[1,'$'],[2,'$$'],[3,'$$$']],true,F.price.length&&unpriced?`${unpriced} places have no verified price and are hidden while a price is selected.`:'');
 h+=grp('dist','Distance','dist',[[5,'5 mi'],[10,'10 mi'],[20,'20 mi'],[30,'30 mi'],[40,'40 mi']],false,'Straight-line distance from '+esc(ref.home?'Glen Ellyn':ref.name)+'. Change the starting point in the menu.');
 if(layer==='E'||layer==='S')h+=grp('cert','Certified by','cert',[['any','Either'],['HMS','HMS'],['HFSAA','HFSAA']],false);
 if(layer==='D'){h+=grp('io','Setting','io',[['any','Either'],['indoor','Indoor'],['outdoor','Outdoor']],false);
  h+=`<button class="sw" data-sw="noAlc" aria-pressed="${F.noAlc}">Hide places that serve alcohol<i></i></button>`}
 h+=`<button class="sw" data-sw="fav" aria-pressed="${F.fav}">Only my saved places<i></i></button>`;
 $('#fBody').innerHTML=h;const n=results().length;$('#fDone').textContent='Show '+n+(n===1?' place':' places')}
$('#fBody').addEventListener('click',e=>{if(e.target.id==='areaMore'){allAreas=!allAreas;const st=$('#fBody').scrollTop;buildFilter();$('#fBody').scrollTop=st;return}
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.sw)F[b.dataset.sw]=!F[b.dataset.sw];
 else{const k=b.dataset.key;let v=b.dataset.v;if(/^\d+$/.test(v))v=+v;if(b.dataset.m==='1'){const a=F[k],i=a.indexOf(v);i<0?a.push(v):a.splice(i,1)}else F[k]=v}
 limit=60;const st=$('#fBody').scrollTop;buildFilter();$('#fBody').scrollTop=st;render(false)});

/* info */
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(openPanel==='pInfo')buildInfo()});
window.addEventListener('appinstalled',()=>{installEvt=null;toast('Installed')});
function mb(n){return n>=1e9?(n/1e9).toFixed(1)+' GB':Math.round(n/1e6)+' MB'}
function buildInfo(){const standalone=matchMedia('(display-mode: standalone)').matches,cnt=k=>P.filter(p=>p.k===k).length;
  const towns=[...TOWNS].sort((a,b)=>a[0].localeCompare(b[0]));
 $('#iBody').innerHTML=`
 ${window.isSecureContext?'':`<div class="li" style="background:var(--surface2);border-radius:12px;padding:14px;margin-bottom:8px;border:0"><h3 class="no">Not secure</h3><p>This copy is opened as a local file or over http, so Chrome blocks location, install and offline use. Put the folder on https hosting (for example Netlify Drop) and open that link. Everything else works here.</p></div>`}
 <div class="li"><h3>Measure from</h3><select id="selFrom" aria-label="Measure distances from"><option value="home" ${ref.home?'selected':''}>Glen Ellyn (home)</option>${ref.user?'<option value="me" selected>My location</option>':''}${towns.filter(t=>t[0]!=='Glen Ellyn').map(t=>`<option value="${esc(t[0])}" ${!ref.home&&!ref.user&&ref.name===t[0]?'selected':''}>${esc(t[0])}</option>`).join('')}</select>
  <div class="btns"><button class="btn" id="bLoc">${svg('pin')}Use my location</button></div><p style="margin-top:8px">Pick any town, or use your location. Your location stays on this phone.</p></div>
 <div class="li" id="dlBox"></div>
 <div class="li"><h3>Install</h3>${standalone?'<p>Running as an installed app.</p>':installEvt?'<p style="margin-bottom:10px">Add Sirat to your home screen.</p><button class="btn f" id="bInstall">Install app</button>':'<p>In Chrome on Android, open the menu and choose Install app. The button appears here once the page is on https.</p>'}</div>
 <div class="li"><h3>Appearance</h3><div class="opts" style="margin-top:8px">${[['auto','Phone setting'],['light','Light'],['dark','Dark']].map(([v,t])=>`<button class="opt" data-theme="${v}" aria-pressed="${saved.theme===v}">${t}</button>`).join('')}</div></div>
 <div class="li"><h3>Map dots</h3><div class="leg"><span class="dot" style="background:var(--brand)"></span>Open now<span class="dot" style="background:#8D918E"></span>Closed now<span class="dot" style="background:var(--surface);border-color:var(--brand)"></span>Hours not verified</div><p style="margin-top:10px">Zoomed out, only the top-rated places in each area show. Zoom in to see the rest.</p></div>
 <div class="li"><h3>About the list</h3><p>${cnt('E')} restaurants, ${cnt('S')} stores, ${cnt('M')} masjids and ${cnt('D')} things to do. Restaurants and stores are certified by HMS or HFSAA only. Masjids are tagged Sunni or Shia from listings and reviews, so confirm if it matters. Each was checked on the date shown on its page. Ratings are a hint, not proof, and places can close without notice, so call first.</p></div>`;
 infoProgress()}
let _est='';
async function infoProgress(){renderDl();try{const e=await navigator.storage.estimate();const u=mb(e.usage||0),q=e.quota?mb(e.quota):'';const t=u+' used'+(q?' of '+q+' available':'');if(t!==_est){_est=t;renderDl()}}catch(e){}}
function renderDl(){const box=$('#dlBox');if(!box)return;const dl=ST.dl,run=!!(dl&&dl.running),t1=tierCount(1),t2=tierCount(2);
 const lab=(t,n,name)=>n>=TOTAL?name+' (saved)':n>0?'Resume '+name.toLowerCase():name;
 let msg='',cls='';
 if(run){msg=dl.cancel?'Pausing…':`Downloading ${dl.t===1?'main roads':'all streets'}… ${dl.done} of ${TOTAL} areas`+(dl.fail?` · ${dl.fail} retr${dl.fail===1?'y':'ies'}`:'');
  if(!dl.cancel&&dl.err&&dl.streak>0){msg+=' · '+dl.err;cls='no'}}
 else if(dl&&dl.stopped&&dl.done<TOTAL){const hint={offline:'Connect to the internet, then tap the button to resume.',busy:'Wait a few minutes, then tap the button to resume.',storage:'Free up space on your phone, then tap the button to resume.',big:'Try again later, then tap the button to resume.'}[dl.errKind]||'Tap the button to resume.';msg='Stopped: '+dl.err.replace(/\.$/,'')+'. '+hint;cls='no'}
 else if(dl&&dl.paused&&dl.done<TOTAL)msg=`Paused at ${dl.done} of ${TOTAL} areas. Tap the button to resume.`;
 const n=run?dl.done:(dl&&dl.t===2?t2:t1);
 box.innerHTML=`<h3>Offline streets</h3><p>Main roads ${t1} of ${TOTAL} areas · All streets ${t2} of ${TOTAL}${_est?' · '+_est:''}</p><div class="bar"><i style="width:${Math.min(100,100*(run?dl.done:Math.max(t1,t2))/TOTAL)}%"></i></div><p class="${cls}" id="dlMsg" style="min-height:1.4em">${esc(msg)}</p>
 <div class="btns"><button class="btn f" id="bDl1" ${run||t1>=TOTAL?'disabled':''}>${svg('down')}${lab(1,t1,'Main roads')}</button><button class="btn" id="bDl2" ${run||t2>=TOTAL?'disabled':''}>${svg('down')}${lab(2,t2,'All streets')}</button>${run?`<button class="btn" id="bStop" ${dl.cancel?'disabled':''}>Pause</button>`:''}${(t1||t2)&&!run?'<button class="btn txt" id="bWipe">Delete</button>':''}</div>
 <p style="margin-top:10px">Roads are fetched once from OpenStreetMap and kept on this phone, so the map works with no signal. Main roads is the quick one. All streets is large and slow, so use Wi-Fi and keep the screen on. You can pause and resume.</p>`}
$('#iBody').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id==='bInstall'&&installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;buildInfo()})}
 if(b.dataset.theme){saved.theme=b.dataset.theme;persist();applyTheme();buildInfo()}
 if(b.id==='bLoc')locate();
 if(b.id==='bDl1')startDownload(1);
 if(b.id==='bDl2')startDownload(2);
 if(b.id==='bStop'){stopDownload();renderDl()}
 if(b.id==='bWipe'){if(confirm('Delete downloaded roads from this phone?'))wipeRoads()}});
$('#iBody').addEventListener('change',e=>{if(e.target.id!=='selFrom')return;const v=e.target.value;
 if(v==='home')setRef({lat:HOME.lat,lng:HOME.lng,name:HOME.name,user:false,home:true});
 else if(v!=='me'){const t=TOWNS.find(x=>x[0]===v);setRef({lat:t[1],lng:t[2],name:t[0],user:false,home:false})}});
function setRef(r){ref=r;recalc();render(false);fly(wx(r.lng),wy(r.lat),Math.max(V.s,6));toast('Measuring from '+(r.home?'Glen Ellyn':r.name))}
function applyTheme(){const r=document.documentElement;saved.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',saved.theme);colors();draw()}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{colors();draw()});
function locate(){if(!navigator.geolocation){toast('Location is not available');return}
 navigator.geolocation.getCurrentPosition(pos=>{const lat=pos.coords.latitude,lng=pos.coords.longitude;const x=wx(lng),y=wy(lat);
  if(Math.hypot(x,y)>60){toast('You are outside the 40-mile area');return}
  setRef({lat,lng,name:'you',user:true,home:false});if(openPanel==='pInfo')buildInfo()},err=>locErr(err),{timeout:10000,maximumAge:60000})}
async function locErr(err){let m='Could not get your location. Try again.';
 if(!window.isSecureContext)m='Location needs https. This copy is a local file, so pick a town under Measure from instead.';
 else if(err&&err.code===1){let st='';try{st=(await navigator.permissions.query({name:'geolocation'})).state}catch(e){}
  m=st==='denied'?'Location is blocked for this site. In Chrome: tap the lock icon by the address, then Permissions, then Location, then Allow.':'Location was not allowed. If this page is inside another app or a preview, open it in Chrome directly.'}
 else if(err&&err.code===2)m='Your phone could not find its position. Check that Location is on in Android settings.';
 else if(err&&err.code===3)m='Finding your position timed out. Try again.';toast(m)}
$('#locate').addEventListener('click',locate);

/* boot */
function boot(){applyTheme();size();renderNav();metrics();setSnap('peek');visPx=VIS.peek;render();layout();V.x=0;V.y=0;V.s=Math.max(4.4,Math.min(W,H-TOPH-VIS.peek-navPx())/2/44);draw()}
addEventListener('resize',()=>{size();renderChips();metrics();setSnap(snap);draw()});
refreshKeys().then(()=>{need()});
boot();
requestAnimationFrame(()=>{renderChips();metrics();setSnap('peek');visPx=VIS.peek;layout();V.s=Math.max(4.4,Math.min(W,H-TOPH-VIS.peek-navPx())/2/44);draw()});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
</body>
</html>
