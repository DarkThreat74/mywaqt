<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;height:100%;overflow:hidden}
  body{display:grid;place-items:center;background:var(--bg)}
  #stage{display:grid;place-items:center;transform:scale(var(--z,1));transform-origin:center}
</style></head><body><div id="stage"></div><script>
  const q = new URLSearchParams(location.search);
  document.body.style.setProperty("--bg", q.get("bg") || "#222");
  if (q.get("z")) document.getElementById("stage").style.setProperty("--z", q.get("z"));
  const s = document.createElement("script");
  s.src = q.get("src");
  s.onload = () => {
    const el = document.createElement(q.get("tag"));
    for (const [k, v] of q) if (k.startsWith("a_")) el.setAttribute(k.slice(2), v);
    document.getElementById("stage").append(el);
  };
  document.head.append(s);
</script></body></html>
