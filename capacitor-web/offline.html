<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Offline — Waqt</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Georgia, serif;
      background: #1a1815;
      color: #f5f0e8;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .container { max-width: 400px; text-align: center; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.75rem; color: #f5f0e8; }
    p { font-size: 0.95rem; color: #a8a098; line-height: 1.5; margin-bottom: 2rem; }
    .retry-btn {
      padding: 0.75rem 2rem; background: #f5f0e8; color: #1a1815;
      border: none; border-radius: 8px; font-size: 0.95rem; font-family: Georgia, serif;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .retry-btn:active { opacity: 0.8; }
    .status { font-size: 0.8rem; color: #a8a098; margin-top: 1.5rem; min-height: 1.2em; }
    .diag { font-size: 0.7rem; color: #6f675e; margin-top: 0.75rem; word-break: break-all; }
    .home-link { display: inline-block; margin-left: 1rem; font-size: 0.85rem; color: #a8a098; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Reconnecting...</h1>
    <p>Your prayer data is cached on this device. The app will load automatically when the connection returns.</p>
    <button class="retry-btn" id="retry">Retry now</button>
    <a class="home-link" href="index.html">Back to home</a>
    <div class="status" id="status"></div>
    <div class="diag" id="diag"></div>
  </div>
  <script>
    // This page is Capacitor's errorPath — it lives on the LOCAL https://localhost
    // origin. location.reload() only reloads THIS error page, which is why it
    // used to loop forever. Recovery means navigating back to the real app.
    // The native client passes the exact URL and error code that failed.
    var params = new URLSearchParams(location.search);
    var APP_URL = params.get('url') || 'https://www.mywaqt.app/';
    var statusEl = document.getElementById('status');
    var diagEl = document.getElementById('diag');
    var attempts = 0;

    var code = params.get('code');
    var desc = params.get('desc');
    if (code || desc) {
      diagEl.textContent = 'Error ' + (code || '?') + (desc ? ' — ' + desc : '') +
        (APP_URL ? ' · ' + APP_URL : '');
    }

    function retry() {
      attempts++;
      statusEl.textContent = 'Opening Waqt…';
      location.replace(APP_URL);
    }

    document.getElementById('retry').addEventListener('click', retry);

    // Real navigation is the only reliable connectivity test in a WebView —
    // navigator.onLine lies. Retry on a steady timer; each attempt either
    // loads the app (page unloads) or lands back here and tries again.
    setInterval(retry, 6000);
  </script>
</body>
</html>
