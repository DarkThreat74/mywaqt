<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Offline — Waqt</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #1a1815; --card: #23201c; --ink: #f5f0e8;
      --muted: #a8a098; --faint: #6f675e; --accent: #77b6b5;
    }
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      min-height: 100vh;
      min-height: 100dvh;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      padding-top: calc(1.25rem + env(safe-area-inset-top, 0px));
      padding-bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px));
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid #2e2a25;
      border-radius: 16px;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #d99a70; margin: 0 auto 1.25rem;
    }
    h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 0.6rem; }
    p { font-size: 0.92rem; color: var(--muted); line-height: 1.55; margin-bottom: 1.75rem; }
    .actions { display: flex; flex-direction: column; gap: 0.75rem; }
    .btn {
      display: block; width: 100%; padding: 0.85rem 1rem;
      border-radius: 10px; font-size: 0.95rem; font-family: inherit;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      text-decoration: none; border: none;
    }
    .btn-primary { background: var(--ink); color: var(--bg); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid #3a352f; }
    .btn:active { opacity: 0.8; }
    .status { font-size: 0.8rem; color: var(--accent); margin-top: 1.5rem; min-height: 1.2em; }
    .diag { font-size: 0.68rem; color: var(--faint); margin-top: 0.6rem; word-break: break-all; }
    @media (min-width: 480px) {
      .actions { flex-direction: row; }
      .btn { width: auto; flex: 1; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <h1>Reconnecting…</h1>
    <p>Your prayer data is cached on this device. Waqt keeps trying in the background — you can also retry now or go back to the home screen.</p>
    <div class="actions">
      <button class="btn btn-primary" id="retry">Retry now</button>
      <a class="btn btn-ghost" href="index.html">Back to home</a>
    </div>
    <div class="status" id="status"></div>
    <div class="diag" id="diag"></div>
  </div>
  <script>
    // This page is Capacitor's errorPath — it lives on the LOCAL
    // https://localhost origin. location.reload() only reloads THIS error
    // page, which is why it used to loop forever. Recovery means navigating
    // back to the real app; the server redirects correctly by session.
    var params = new URLSearchParams(location.search);
    var APP_URL = params.get('url') || 'https://www.mywaqt.app/';
    var statusEl = document.getElementById('status');
    var diagEl = document.getElementById('diag');

    var code = params.get('code');
    var desc = params.get('desc');
    if (code || desc) {
      diagEl.textContent = 'Error ' + (code || '?') + (desc ? ' — ' + desc : '') +
        ' · ' + APP_URL;
    }

    var countdown = 8;
    var timer;

    function retry() {
      clearInterval(timer);
      statusEl.textContent = 'Opening Waqt…';
      // replace() so the error page doesn't stack in WebView history —
      // pressing Back from the app must not land here again.
      location.replace(APP_URL);
    }

    function tick() {
      countdown--;
      if (countdown <= 0) { retry(); return; }
      statusEl.textContent = 'Trying again in ' + countdown + 's';
    }

    document.getElementById('retry').addEventListener('click', retry);

    // Real navigation is the only reliable connectivity test in a WebView —
    // navigator.onLine lies. Retry on a steady timer; each attempt either
    // loads the app (page unloads) or lands back here and tries again.
    statusEl.textContent = 'Trying again in ' + countdown + 's';
    timer = setInterval(tick, 1000);
  </script>
</body>
</html>
