<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1815">
  <title>Waqt</title>
  <style>
    :root { color-scheme: light; font-family: Georgia, serif; background: #f5f0e8; color: #332f2a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 420px); }
    .mark { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 16px; background: #332f2a; color: #f5f0e8; font-size: 26px; }
    h1 { margin: 24px 0 8px; font-size: 30px; letter-spacing: -.03em; }
    p { margin: 0; color: #6f675e; line-height: 1.55; }
    .status { display: flex; align-items: center; gap: 8px; margin-top: 24px; font-size: 13px; color: #6f675e; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #b56d3d; }
    .actions { display: grid; gap: 10px; margin-top: 24px; }
    button, a { min-height: 48px; border: 1px solid #d9d0c3; border-radius: 12px; padding: 12px 16px; font: inherit; text-align: center; text-decoration: none; cursor: pointer; }
    button { background: #332f2a; color: #f5f0e8; }
    a { background: transparent; color: #332f2a; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">و</div>
    <h1>Waqt</h1>
    <p id="message">Starting locally. Your app opens as soon as the connection is reachable.</p>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Checking connection…</span></div>
    <div class="actions">
      <button id="retry" type="button">Try again</button>
      <a id="web" class="hidden" href="https://www.mywaqt.app/prayer">Open Waqt online</a>
    </div>
  </main>
  <script>
    (function () {
      var remote = "https://www.mywaqt.app/prayer";
      var status = document.getElementById("status");
      var message = document.getElementById("message");
      var dot = document.getElementById("dot");
      var retry = document.getElementById("retry");
      var web = document.getElementById("web");
      var timer;
      function openOnline() {
        clearTimeout(timer);
        // Do not perform a cross-origin health probe here. Android WebView can
        // reject an otherwise reachable HTTPS probe because of CORS/redirect
        // handling. Let the real navigation decide; Capacitor owns fallback.
        status.textContent = "Opening Waqt…";
        dot.style.background = "#3c7d5a";
        location.replace(remote);
      }
      function showOffline() {
        status.textContent = "Offline mode";
        message.textContent = "The app shell is ready. Connect to the internet to load your account and latest data.";
        web.classList.remove("hidden");
      }
      function start() {
        if (navigator.onLine === false) showOffline();
        else openOnline();
      }
      retry.addEventListener("click", start);
      window.addEventListener("online", start);
      start();
    }());
  </script>
</body>
</html>
