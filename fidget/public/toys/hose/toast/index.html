<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rubber Hose Toast</title>
<style>
  :root { --ink: #251d16; --paper: #ecd7ac; --cream: #fbe7c0; --mute: #6f5a40; --hand: "Hose Hand", "Patrick Hand", "Comic Sans MS", "Chalkboard SE", cursive; }
  html { overflow-x: clip; background: var(--paper) url(../gallery/paper.jpg) center / cover fixed; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: var(--ink); font: 400 19px/1.3 var(--hand); overflow-x: clip; }
  main { width: min(640px, 100vw - 32px); padding: 34px 0 56px; text-align: center; }
  h1 { margin: 0; font: 400 32px/1.1 var(--hand); }
  .sub { margin: 4px 0 0; color: var(--mute); }
  .stage { display: grid; justify-items: center; align-content: center; gap: 8px; min-height: 250px; padding: 14px 0; }
  .hint { margin: 0 4px; color: var(--mute); font-size: 17px; }
  .said { margin: 8px 4px 0; min-height: 1.4em; }
  .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; margin: 14px 4px 0; }
  .row input[type=range] { width: 200px; accent-color: #e4472c; }
  .pill { min-height: 34px; padding: 2px 14px 4px; border: 2.5px solid var(--ink); border-radius: 999px; background: var(--cream); box-shadow: 0 3px 0 rgba(37, 29, 22, .25); font: inherit; font-size: 17px; color: inherit; cursor: pointer; }
  .pill:active { translate: 0 2px; box-shadow: 0 1px 0 rgba(37, 29, 22, .25); }
  a { color: inherit; } :focus-visible { outline: 3px dashed var(--ink); outline-offset: 3px; }
  code { font: inherit; padding: 0 5px 1px; border-radius: 6px; background: rgba(251, 231, 192, .8); border: 1.5px solid rgba(37, 29, 22, .3); }
  .embed { background: var(--paper); } .embed body { place-items: start center; min-height: 0; } .embed h1, .embed .sub, .embed .hint, .embed .back { display: none; } .embed main { padding: 0; }
</style>
</head>
<body>
<main>
  <h1>Toast</h1>
  <p class="sub">A notification who is a toaster. <code>&lt;hose-toast&gt;</code></p>
  <div class="stage">
    <hose-toast id="el" stay></hose-toast>
    <button class="pill" type="button" id="save">Save</button>
  </div>
  <p class="hint">Press Save. On this page he has the stay attribute, so he is there between toasts.</p>
  <p class="said" aria-live="polite"></p>
  <p class="hint back"><a href="../gallery/">All eleven</a> · <a href="https://github.com/finktheartist/rubber-hose-ui/blob/main/toast/README.md">Docs</a></p>
</main>
<script src="toast.js"></script>
<script>
// This page's own wiring. The component is all in toast.js.
// ?embed=1 hides the heading and the hint.
const Q = new URLSearchParams(location.search), el = document.getElementById('el'), said = document.querySelector('.said');
if (Q.get('embed') === '1') document.documentElement.classList.add('embed');
const say = (t) => { said.textContent = t; };
el.addEventListener('hose:line', (e) => say(e.detail.text)); if (el.line) say(el.line);
document.getElementById('save').addEventListener('click', () => el.show('Saved successfully!', 'Saved!'));
</script>
</body>
</html>
